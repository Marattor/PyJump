<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyJump — скачать игру</title>
    <style>
        /* ── Общий сброс и фон ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        /* ── Карточка игры ── */
        .card {
            max-width: 520px;
            width: 100%;
            background: linear-gradient(145deg, #14182b, #1a1f35);
            border-radius: 48px;
            padding: 48px 40px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            text-align: center;
            transition: transform 0.25s ease;
        }

        .card:hover {
            transform: scale(1.01);
        }

        /* ── Логотип ── */
        .logo {
            font-size: 70px;
            font-weight: 700;
            background: linear-gradient(135deg, #52d4ee, #7b2fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            line-height: 1.3;
        }

        .subtitle {
            color: #8892b0;
            font-size: 18px;
            font-weight: 400;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .subtitle span {
            color: #64ffda;
        }

        /* ── Разделитель ── */
        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #7b2fff);
            margin: 24px auto 28px;
            border-radius: 4px;
        }

        /* ── Кнопка скачивания ── */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2fff);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 60px;
            text-decoration: none;
            box-shadow: 0 8px 28px rgba(0, 212, 255, 0.25);
            transition: all 0.25s ease;
            width: 100%;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(0, 212, 255, 0.4);
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        .download-btn .icon {
            font-size: 28px;
            line-height: 1;
        }

        /* ── Блок с мета-ссылками ── */
        .meta-links {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .meta-links a {
            color: #5a6a8a;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .meta-links a:hover {
            color: #c0d0f0;
        }

        .meta-links a:visited {
            color: #779ff0;  /* ← ФИОЛЕТОВЫЙ УБРАН! */
        }

        .meta-links .badge {
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            color: #ffffff;
        }

        /* ── Инфо-блок ── */
        .info {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #1e2640;
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        .info-item {
            color: #5a6a8a;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-item strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* ── Ссылки в info ── */
        .info a {
            color: #5a6a8a;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .info a:hover {
            color: #ffffff;
        }

        .info a:visited {
            color: #4582fd;  /* ← ФИОЛЕТОВЫЙ УБРАН! */
        }

        /* ── Адаптив ── */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 28px;
            }
            .logo {
                font-size: 38px;
            }
            .download-btn {
                font-size: 18px;
                padding: 16px 24px;
            }
            .meta-links {
                gap: 16px;
            }
            .info {
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- Логотип -->
        <div class="logo">PyJump</div>
        <div class="subtitle">
            Редактор уровней · <span>Вдохновлен Geometry Dash</span>
        </div>

        <div class="divider"></div>

        <!-- Кнопка скачивания -->
        <a href="https://github.com/Marattor/PyJump/releases/download/0.1/PyJump.exe"
           class="download-btn">
            <span class="icon">⬇</span>
            Скачать игру
            <span style="font-weight:400; opacity:0.7; font-size:16px;">(27 МБ)</span>
        </a>

        <!-- Мета-ссылки -->
        <div class="meta-links">
            <span class="info-item">📁 <strong>v0.1</strong></span>
            <span class="badge">Windows 7 и больше</span>
        </div>

        <!-- Доп. информация -->
        <div class="info">
            <a href="https://github.com/Marattor/PyJump">
                <span>🐙</span> GitHub
            </a>
            <span class="info-item"><strong><p>© 2026 Marattor. Все права защищены.</p>
            </strong></span>
        </div>

    </div>

</body>
</html>
